try{dl=JSON.parse(localStorage.getItem(DK)||'[]')}catch(e){}
DATA=DATA.filter(function(p){return dl.indexOf(p.id)<0});
function redraw(){if(document.getElementById('l'))draw(curSec,document.getElementById('q').value)}
function confirmDel(p){var o=document.createElement('div');o.className='ov';
  o.innerHTML='<div class="card" style="max-width:340px;text-align:center"><div class="nm" style="text-align:center">'+esc(p.nom+' '+p.pre)+'</div><div style="margin-top:8px;font-size:14px">Supprimer cette fiche ?</div><div class="acts" style="justify-content:center"><button class="mini" data-a="y" style="background:#c0392b">Supprimer</button><button class="mini ok" data-a="n">Annuler</button></div></div>';
  o.onclick=function(e){var a=e.target.dataset&&e.target.dataset.a;if(!a)return;document.body.removeChild(o);
    if(a==='y'){dl.push(p.id);try{localStorage.setItem(DK,JSON.stringify(dl))}catch(x){}DATA=DATA.filter(function(q){return q!==p});toast('Supprimé');redraw()}};
  document.body.appendChild(o)}
var AK='wnc_alarm_v1',AS={on:true,done:''};
try{AS=Object.assign(AS,JSON.parse(localStorage.getItem(AK)||'{}'))}catch(e){}
function asave(){try{localStorage.setItem(AK,JSON.stringify(AS))}catch(e){}}
function tds(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function due(){var d=new Date().getDate();return AS.on&&(d===1||d===22)&&AS.done!==tds()}
function nextAl(){var n=new Date(),y=n.getFullYear(),m=n.getMonth(),t=new Date(y,m,n.getDate()),c=[new Date(y,m,1),new Date(y,m,22),new Date(y,m+1,1)];
  for(var i=0;i<c.length;i++)if(c[i]>=t)return c[i];return c[2]}
function pad(x){return (x<10?'0':'')+x}
var ctx=null,rt=null;
function beep(){try{var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.35);if(navigator.vibrate)navigator.vibrate(300)}catch(e){}}
function startRing(){if(rt)return;try{ctx=new (window.AudioContext||window.webkitAudioContext)();
  var go=function(){if(ctx.state==='suspended')ctx.resume()};go();document.addEventListener('pointerdown',go,{once:true});
  rt=setInterval(beep,1000);setTimeout(stopRing,60000)}catch(e){}}
function stopRing(){clearInterval(rt);rt=null;try{ctx&&ctx.close()}catch(e){}ctx=null}
function alarmHtml(){
  if(due())return '<div class="alarm"><span>🔔 Rappel : aujourd’hui le '+new Date().getDate()+'</span><button id="alx">Arrêter</button></div>';
  var n=nextAl();
  return '<div class="nx"><span>'+(AS.on?'🔔 Prochain rappel : '+pad(n.getDate())+'/'+pad(n.getMonth()+1)+'/'+n.getFullYear():'🔕 Rappels désactivés')+' (1 et 22)</span><button id="alt">'+(AS.on?'Désactiver':'Activer')+'</button></div>'}
function alarmBind(){var x=document.getElementById('alx'),t=document.getElementById('alt');
  if(x)x.onclick=function(){stopRing();AS.done=tds();asave();home()};
  if(t)t.onclick=function(){AS.on=!AS.on;asave();if(AS.on&&due())startRing();home()}}
if(due())startRing();
setInterval(function(){if(due()&&!rt&&document.getElementById('alx')===null&&document.querySelector('h1')){startRing();home()}},60000);
function addForm(def){var o=document.createElement('div');o.className='ov';
  o.innerHTML='<div class="card fm"><h3>➕ Nouvelle personne</h3>'+FL.map(function(f){return '<label class="f">'+f[1]+'<input data-k="'+f[0]+'"'+(f[0]==='email'?' type="email" dir="ltr"':'')+'></label>'}).join('')
    +'<label class="f">Section<select id="asec">'+SECS.map(function(x){return '<option value="'+x[0]+'"'+(x[0]===def?' selected':'')+'>'+(x[0]||'Non classé')+'</option>'}).join('')+'</select></label>'
    +'<div class="acts"><button class="mini ok" data-a="y">Ajouter</button><button class="mini" data-a="n">Annuler</button></div></div>';
  o.onclick=function(e){var a=e.target.dataset&&e.target.dataset.a;if(!a)return;
    if(a==='n'){document.body.removeChild(o);return}
    var n={id:'add:'+Date.now(),ns:'',nom:'',pre:'',date:'',mdp:'',ref:'',tel:'',email:'',sec:o.querySelector('#asec').value};
    o.querySelectorAll('input[data-k]').forEach(function(x){n[x.dataset.k]=x.value.trim()});
    if(!n.nom&&!n.pre){toast('Nom ou prénom requis');return}
    document.body.removeChild(o);DATA.push(n);AD.push(n);
    try{localStorage.setItem(ADK,JSON.stringify(AD))}catch(x){}
    mf=-1;toast('Ajouté');if(document.getElementById('l'))redraw();else home()};
  document.body.appendChild(o)}
function home(){
  var h='<h1>WNC MENACERA</h1>'+alarmHtml();
  SECS.slice(0,3).forEach(function(s){var n=DATA.filter(function(p){return p.sec===s[0]}).length;
    h+='<button class="btn" data-s="'+s[0]+'"><span class="ico">'+s[1]+'</span><span class="lbl">'+s[0]+'</span><span class="cnt">'+n+'</span></button>'});
  var u=DATA.filter(function(p){return !p.sec}).length;
  if(u)h+='<button class="btn small" data-s="">❔ Non classé ('+u+')</button>';
  h+='<button class="btn small" id="addp">➕ Ajouter une personne</button>';
  app.innerHTML=h;
  app.querySelectorAll('.btn[data-s]').forEach(function(b){b.onclick=function(){list(b.dataset.s,'')}});
  document.getElementById('addp').onclick=function(){addForm('')};
  alarmBind();
}
function list(sec,q){
  mf=-1;editing=null;curSec=sec;
  var name=sec||'Non classé';
  var h='<div class="top"><button class="back" id="bk">← Retour</button><h2>'+name+'</h2><button class="back" id="ad" style="margin-inline-start:auto">➕ Ajouter</button></div><input class="s" id="q" placeholder="Rechercher un nom ou un téléphone" value="'+esc(q)+'"><div class="chips" id="ch"></div><div id="l"></div>';
  app.innerHTML=h;
  document.getElementById('bk').onclick=home;
  document.getElementById('ad').onclick=function(){addForm(sec)};
  var qi=document.getElementById('q');qi.oninput=function(){draw(sec,qi.value)};
  draw(sec,q);
}
function draw(sec,q){
  q=q.trim().toLowerCase();
  var base=DATA.filter(function(p){return p.sec===sec&&(!q||(p.nom+' '+p.pre+' '+p.tel+' '+p.ref).toLowerCase().indexOf(q)>=0)});
  var have={};base.forEach(function(p){have[mo(p)]=1});
  var ch=document.getElementById('ch'),cs='<button class="chip'+(mf===-1?' on':'')+'" data-f="-1">Tous</button>';
  for(var m=1;m<=12;m++)if(have[m])cs+='<button class="chip'+(mf===m?' on':'')+'" data-f="'+m+'">'+MN[m]+'</button>';
  if(have[0])cs+='<button class="chip'+(mf===0?' on':'')+'" data-f="0">Sans date</button>';
  ch.innerHTML=cs;
  ch.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){mf=parseInt(c.dataset.f);draw(sec,document.getElementById('q').value)}});
  var items=mf>=0?base.filter(function(p){return mo(p)===mf}):base.slice();
  items.sort(function(a,b){return (mo(a)||99)-(mo(b)||99)||dy(a)-dy(b)});
  var l=document.getElementById('l');
  if(!items.length){l.innerHTML='<div class="empty">Aucun résultat</div>';return}
  var last=-1,cnt={};items.forEach(function(p){cnt[mo(p)]=(cnt[mo(p)]||0)+1});
  l.innerHTML=items.map(function(p){
    var hd='';if(mo(p)!==last){last=mo(p);hd='<div class="mh">'+(last?MN[last]:'Sans date')+'<span>'+cnt[last]+'</span></div>'}
    return hd+cardHtml(p)}).join('');
  bind(l,sec);
}
function cardHtml(p){
  {
    var i=DATA.indexOf(p),tel=p.tel.replace(/[^0-9+]/g,'');
    if(editing===p.id)return '<div class="card">'+FL.map(function(f){return '<label class="f">'+f[1]+'<input data-k="'+f[0]+'" value="'+esc(p[f[0]])+'"'+(f[0]==='email'?' type="email" dir="ltr"':'')+'></label>'}).join('')+'<div class="acts"><button class="mini ok" data-sv="'+i+'">Enregistrer</button><button class="mini" data-cx="1">Annuler</button></div></div>';
    return '<div class="card"><div class="hd"><div class="nm">'+esc(p.nom+' '+p.pre)+'</div><div class="hb"><button class="sc" data-del="'+i+'" aria-label="Supprimer">'+TRI+'</button><button class="mini" data-e="'+i+'">Modifier</button></div></div>'
    +(p.ref?'<div class="row"><span>Nom complémentaire</span><span>'+esc(p.ref)+'</span></div>':'')
    +'<div class="row"><span>E-mail</span>'+(p.email?'<a class="v" href="mailto:'+esc(p.email)+'">'+esc(p.email)+'</a>':'<span class="v">—</span>')+'</div>'
    +(tel?'<div class="row"><span>Téléphone</span><a class="v" href="tel:'+tel+'">'+esc(p.tel)+'</a></div>':'')
    +'<div class="row"><span>N° Sécurité sociale</span><span class="v" data-h="'+i+'n">••••••••</span><button class="mini" data-r="'+i+'n">Afficher</button></div>'
    +'<div class="row"><span>Mot de passe</span><span class="v" data-h="'+i+'m">••••••••</span><button class="mini" data-r="'+i+'m">Afficher</button><button class="mini" data-c="'+i+'">Copier</button></div>'
    +'<div class="row"><span>Section</span><select data-m="'+i+'">'+SECS.map(function(s){return '<option value="'+s[0]+'"'+(s[0]===p.sec?' selected':'')+'>'+(s[0]||'Non classé')+'</option>'}).join('')+'</select></div></div>'}}
function bind(l,sec){
  l.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){confirmDel(DATA[b.dataset.del])}});
  var q=function(){return document.getElementById('q').value};
  l.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){editing=DATA[b.dataset.e].id;draw(sec,q())}});
  l.querySelectorAll('[data-cx]').forEach(function(b){b.onclick=function(){editing=null;draw(sec,q())}});
  l.querySelectorAll('[data-sv]').forEach(function(b){b.onclick=function(){
    var p=DATA[b.dataset.sv],e={};
    l.querySelectorAll('input[data-k]').forEach(function(x){p[x.dataset.k]=x.value.trim();e[x.dataset.k]=p[x.dataset.k]});
    ed[p.id]=e;try{localStorage.setItem(EK,JSON.stringify(ed))}catch(x){}
    editing=null;toast('Enregistré');draw(sec,q())}});
  l.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){
    var k=b.dataset.r,i=parseInt(k),el=l.querySelector('[data-h="'+k+'"]'),on=b.textContent==='Afficher';
    el.textContent=on?(k.slice(-1)==='n'?DATA[i].ns:DATA[i].mdp):'••••••••';b.textContent=on?'Masquer':'Afficher'}});
  l.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){
    var v=DATA[b.dataset.c].mdp;
    (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(function(){toast('Copié')},function(){toast('Copie impossible')})}});
  l.querySelectorAll('[data-m]').forEach(function(s){s.onchange=function(){
    var p=DATA[s.dataset.m];p.sec=s.value;over[p.id]=s.value;
    try{localStorage.setItem(KEY,JSON.stringify(over))}catch(e){}
    toast('Déplacé');draw(sec,document.getElementById('q').value)}});
}
home();
</script>
</body>
</html>
